# /opt/stack/fulcrum/fulcrum.conf
# Fulcrum 設定案（docs/node-design.md 4.2 を参照）
# <...> の箇所は環境に合わせて置き換える。

# ---- データ ----
datadir = /opt/stack/fulcrum/db

# ---- bitcoind 接続（クッキー認証）----
bitcoind = 127.0.0.1:8332
rpccookie = /opt/stack/bitcoin/.cookie
bitcoind_clients = 8
bitcoind_timeout = 300
zmq_block = tcp://127.0.0.1:28332

# ---- 待ち受け（ローカルのみ。外部には Tor hidden service 経由で公開）----
tcp = 127.0.0.1:50001
# ssl は使わない（Q13）
admin = 127.0.0.1:8000

# ---- 自分専用サーバーとして振る舞う ----
peering = false
announce = false
tor_hostname = <hs-fulcrum の .onion アドレス>
tor_tcp_port = 50001
max_clients_per_ip = 0

# ---- 性能 ----
worker_threads = 16
db_mem = 4096
fast-sync = 16000           # 初期同期時のみ。完了後はこの行を削除して再起動する
polltime = 2.0

# ---- ログ ----
# 標準出力に出す。launchd 側でファイルに落とす
