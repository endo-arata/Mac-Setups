# /etc/newsyslog.d/stack.conf
# launchd が書く各サービスのログを週次でローテーションし、圧縮して 8 世代残す。
# 形式: logfilename  [owner:group]  mode  count  size(KB)  when  flags
/opt/stack/tor/launchd.log      _btcnode:staff  640  8  *  $W0D0  J
/opt/stack/tor/tor.log          _btcnode:staff  640  8  *  $W0D0  J
/opt/stack/bitcoin/launchd.log  _btcnode:staff  640  8  *  $W0D0  J
/opt/stack/fulcrum/launchd.log  _btcnode:staff  640  8  *  $W0D0  J
/opt/stack/monitor/monitor.log  _btcnode:staff  640  8  *  $W0D0  J
