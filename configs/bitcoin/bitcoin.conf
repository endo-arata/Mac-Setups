# /opt/stack/bitcoin/bitcoin.conf
# Bitcoin Core 設定案（docs/node-design.md 3.2 を参照）
# <...> の箇所は環境に合わせて置き換える。
# datadir は launchd 側で -datadir=/opt/stack/data/bitcoin（Stack ボリューム）を渡す。

# ---- 基本 ----
daemon=0
server=1
txindex=1
prune=0
blockfilterindex=1          # BIP158 フィルタ（約 10GB）。将来の軽量クライアント用（決定 Q19）
peerblockfilters=1          # 接続してきたピアにもフィルタを提供する

# ---- メモリ ----
dbcache=16384               # IBD 中。同期完了後は 4096 に下げて再起動する
maxmempool=2000

# ---- RPC（ローカルのみ、クッキー認証）----
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcthreads=16
rpcworkqueue=64

# ---- ZMQ（Fulcrum 向け新ブロック通知）----
zmqpubhashblock=tcp://127.0.0.1:28332

# ---- ネットワーク: 発信は Tor のみ ----
proxy=127.0.0.1:9050
onlynet=onion
dnsseed=0                   # onlynet=onion では DNS シードは使わない。固定シードの onion で十分

# ---- ネットワーク: 受信は静的 hidden service 経由 ----
listen=1
bind=127.0.0.1:8334=onion   # torrc の hs-bitcoind が 8333 -> 127.0.0.1:8334 に転送する
externalip=<hs-bitcoind の .onion アドレス>
listenonion=0               # Tor 自動設定（ControlPort）は使わない
discover=0
upnp=0
natpmp=0

# ---- ログ ----
printtoconsole=0
logtimestamps=1
shrinkdebugfile=1
